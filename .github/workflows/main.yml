name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          mise_toml: |
            [tools]
            pnpm = "latest"
      - run: pnpm install
      - run: pnpm run typecheck
  oxc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          mise_toml: |
            [tools]
            pnpm = "latest"
      - run: pnpm install
      - run: pnpm run format
      - run: pnpm run lint
  markuplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          mise_toml: |
            [tools]
            pnpm = "latest"
      - run: pnpm install
      - run: pnpm run lint:markup
